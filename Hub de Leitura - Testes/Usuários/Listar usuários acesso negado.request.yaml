$kind: http-request
url: "{{baseUrl}}users"
method: GET
headers:
  Authorization: "{{token}}"
body:
  type: json
  content: ""
scripts:
  - type: afterResponse
    code: "pm.test(\"Deve validar se o status code é 403\", function () {\r

      \    pm.response.to.have.status(403);\r

      });\r

      pm.test(\"Validar mensagem de sucesso\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\"Acesso negado. Apenas administradores podem realizar esta ação.\");\r

      });\r\n"
    language: text/javascript
order: 6000
