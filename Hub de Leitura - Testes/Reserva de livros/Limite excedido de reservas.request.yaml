$kind: http-request
url: "{{baseUrl}}reservations"
method: POST
headers:
  accept: "*/*"
  Authorization: "{{token}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "bookId": 8
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"Deve validar se status code é 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      pm.test(\"Deve validar mensagem de sucesso\", function () {\r

      \    pm.expect(pm.response.text()).to.include(\"Você atingiu o limite máximo de 5 reservas simultâneas.\");\r

      });"
    language: text/javascript
order: 2000
